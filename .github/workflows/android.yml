# Builds MeterReader.apk, the Android install file: the web files in this repo inside a Capacitor shell.
# A v* tag publishes it on a GitHub Release; any other run keeps it as a build artifact.
name: Android app

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [android-app]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install the Android shell
        run: npm install

      - name: Collect the web files
        run: |
          mkdir -p www/vendor/leaflet
          cp -R index.html app.js styles.css manifest.json guide.html icon.svg icon-192.png icon-512.png www/
          # Leaflet comes from unpkg on the web; in the app it ships inside the install so the map screen opens offline.
          cp -R node_modules/leaflet/dist/leaflet.js node_modules/leaflet/dist/leaflet.css node_modules/leaflet/dist/images www/vendor/leaflet/
          sed -i 's#https://unpkg.com/leaflet@1.9.4/dist/#vendor/leaflet/#g' www/index.html
          grep -n 'leaflet' www/index.html
          if grep -q 'unpkg.com' www/index.html; then echo "::error::index.html still loads from unpkg"; exit 1; fi

      - name: Create the Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Version, permissions and icons
        run: |
          VERSION=$(sed -n "s/^ *const APP_VERSION = 'v\{0,1\}\(.*\)';/\1/p" app.js)
          if [ -z "$VERSION" ]; then echo "::error::APP_VERSION not found in app.js"; exit 1; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"$VERSION\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

          # Location for the map's "my position"; storage only for Documents / MeterReader on older Android.
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n</manifest>#' "$M"
          sed -i 's#<application#<application android:requestLegacyExternalStorage="true"#' "$M"
          cat "$M"

          # Launcher icon and launch screen from the app's own icon.
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          RES=android/app/src/main/res
          rm -rf "$RES/mipmap-anydpi-v26"
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            for f in ic_launcher ic_launcher_round; do
              convert icon-512.png -resize "${d#*:}x${d#*:}" "$RES/mipmap-${d%:*}/$f.png"
            done
            rm -f "$RES/mipmap-${d%:*}/ic_launcher_foreground.png"
          done
          find "$RES" -name splash.png | while read -r f; do
            size=$(identify -format '%wx%h' "$f")
            convert -size "$size" 'xc:#1a2438' \( icon-512.png -resize 192x192 \) -gravity center -composite "$f"
          done

      - name: Build
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::The signing key is not set up: add the ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD repo secrets (see README)."
            exit 1
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/key.p12"
          "$BT/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          # The keystore holds one key, so no alias is needed (the LVB key, alias lvb, works as-is).
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/key.p12" --ks-type PKCS12 \
            --ks-pass env:KEYSTORE_PASSWORD --out MeterReader.apk aligned.apk
          "$BT/apksigner" verify --print-certs MeterReader.apk
          rm -f "$RUNNER_TEMP/key.p12"
          ls -la MeterReader.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MeterReader-${{ env.VERSION }}
          path: MeterReader.apk

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" MeterReader.apk --title "Meter Reader $VERSION" \
            --notes "Android install file for Meter Reader $VERSION. Open MeterReader.apk on the phone to install or update; bundles and reads are kept."
